name: Sync validation stack

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Sync skeleton validation stack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update package floors and installer defaults
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path

          composer_path = Path('composer.json')
          composer = json.loads(composer_path.read_text())
          require = composer['require']
          require['componenta/app'] = '^3.0.2'
          require['componenta/app-console'] = '^3.0.2'
          require['componenta/config'] = '^2.0.2'
          require['componenta/di'] = '^4.0.2'
          require['componenta/validation'] = '^2.0.0'
          require['componenta/validation-app'] = '^1.0.0'
          composer['require'] = dict(sorted(require.items()))
          composer_path.write_text(json.dumps(composer, indent=2, ensure_ascii=False) + '\n')

          installer_path = Path('installer/Installer.php')
          source = installer_path.read_text()

          replacements = {
              "        'componenta/error-handler-app',\n        'componenta/path-resolver',\n":
                  "        'componenta/error-handler-app',\n        'componenta/path-resolver',\n        'componenta/validation',\n        'componenta/validation-app',\n",
              "        'componenta/uuid',\n        'componenta/validation',\n        'psr/clock',\n":
                  "        'componenta/uuid',\n        'psr/clock',\n",
              "        'componenta/app' => '^3.0.1',\n": "        'componenta/app' => '^3.0.2',\n",
              "        'componenta/app-console' => '^3.0.1',\n": "        'componenta/app-console' => '^3.0.2',\n",
              "        'componenta/config' => '^2.0.1',\n": "        'componenta/config' => '^2.0.2',\n",
              "        'componenta/cqrs-app' => '^3.0.1',\n": "        'componenta/cqrs-app' => '^3.0.2',\n",
              "        'componenta/di' => '^4.0.1',\n":
                  "        'componenta/di' => '^4.0.2',\n        'componenta/validation' => '^2.0.0',\n        'componenta/validation-app' => '^1.0.0',\n",
          }

          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, got {count}: {old!r}')
              source = source.replace(old, new)

          installer_path.write_text(source)
          Path('.github/workflows/sync-validation-stack.yml').unlink()
          PY
      - name: Commit synchronized skeleton
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json installer/Installer.php .github/workflows/sync-validation-stack.yml
          git commit -m 'Update skeleton to released validation stack'
          git push
