name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: php -l installer/Installer.php
      - run: php -l installer/verify-dependencies.php
      - name: Resolve root package graph from Packagist
        run: composer update --no-interaction --prefer-dist --no-scripts --no-progress
      - name: Show resolved validation integration package
        run: composer show componenta/validation-app --format=json
      - name: Verify dependency floors and every preset graph
        run: php installer/verify-dependencies.php
      - name: Run the default installer preset non-interactively
        shell: bash
        run: |
          set -euo pipefail
          composer run-script post-root-package-install --no-interaction
          composer update --no-interaction --prefer-dist --no-scripts --no-progress
          test -d tests
          test -f tests/SmokeTest.php
          test ! -d installer
          python <<'PY'
          import json
          from pathlib import Path

          composer = json.loads(Path('composer.json').read_text())
          if composer.get('repositories'):
              raise SystemExit('Generated project must not contain custom Composer repositories.')
          if 'installer/Installer.php' in composer.get('autoload', {}).get('classmap', []):
              raise SystemExit('Installer classmap entry was not removed.')
          for script in (
              'post-root-package-install',
              'post-create-project-cmd',
              'post-install-cmd',
          ):
              if script in composer.get('scripts', {}):
                  raise SystemExit(f'Installer lifecycle script remains: {script}')
          PY
          composer validate --strict
      - run: composer test

  publish:
    if: startsWith(github.event.head_commit.message, 'Release v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          first_line="${COMMIT_MESSAGE%%$'\n'*}"
          tag="${first_line#Release }"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
