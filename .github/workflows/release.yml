name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: php -l installer/Installer.php
      - run: composer update --no-interaction --prefer-dist --no-scripts
      - name: Verify installed release versions and installer floors
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          import subprocess
          from pathlib import Path

          data = json.loads(subprocess.check_output([
              'composer', 'show', '--direct', '--format=json'
          ]))
          installed = {
              package['name']: package['version'].lstrip('v')
              for package in data['installed']
          }
          expected = {
              'componenta/app': '3.0.2',
              'componenta/app-console': '3.0.2',
              'componenta/config': '2.0.2',
              'componenta/di': '4.0.2',
              'componenta/validation': '2.0.0',
              'componenta/validation-app': '1.0.0',
          }
          for package, version in expected.items():
              actual = installed.get(package)
              if actual != version:
                  raise SystemExit(f'{package}: expected {version}, got {actual}')

          installer = Path('installer/Installer.php').read_text()
          required = {
              "'componenta/app' => '^3.0.2'",
              "'componenta/app-console' => '^3.0.2'",
              "'componenta/config' => '^2.0.2'",
              "'componenta/cqrs-app' => '^3.0.2'",
              "'componenta/di' => '^4.0.2'",
              "'componenta/validation' => '^2.0.0'",
              "'componenta/validation-app' => '^1.0.0'",
          }
          missing = sorted(item for item in required if item not in installer)
          if missing:
              raise SystemExit('Missing installer floors: ' + ', '.join(missing))
          PY
      - run: composer test

  publish:
    if: startsWith(github.event.head_commit.message, 'Release v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          first_line="${COMMIT_MESSAGE%%$'\n'*}"
          tag="${first_line#Release }"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
